[project]
name = "amv-analyzer"
version = "0.1.0"
description = "Sidecar de análise do AMV Studio (áudio, cenas, fala). Opcional: o app funciona sem ele."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]
speech = ["faster-whisper>=1.1,<2", "av>=11,<19"]
package = ["pyinstaller>=6.10,<7"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["amv_analyzer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
